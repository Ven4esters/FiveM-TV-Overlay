# Инструменты разбора — разовые скрипты исследователя, а не библиотека.
# Они читают файлы из /tmp, грепают строки через open() и печатают в stdout:
# правила про context manager, Path.open и «небезопасный /tmp» здесь только
# мешают. Пробник для заказчика (tools/alloha/probe_bnsi.py) сюда не входит —
# он живёт выше и проверяется общими правилами.
extend-exclude = ["bnsi_probe.py", "decode_app.py", "extract_pool.js", "borth.js"]
