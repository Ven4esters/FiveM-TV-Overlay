name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Линтер, типы, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Системные библиотеки для тестов интерфейса
        # Тесты панели создают QApplication, а ему нужны библиотеки Qt,
        # которых на голом ubuntu-latest нет: падение выглядело как
        # `ImportError: libEGL.so.1: cannot open shared object file` —
        # и валило 26 тестов, хотя локально (где библиотеки есть) они
        # проходили. Это НЕ ошибка кода, поэтому чинится здесь.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxrender1 libxi6 libxtst6 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-sync1 libxcb-shm0 libxcb-xfixes0

      - name: Браузер для тестов воспроизведения
        # Chromium нужен тестам с пометкой `browser`. Без него pytest их
        # пропускает, а вместе с ними уходит и покрытие — 10 пунктов вниз.
        # Ставим только браузер, без системных зависимостей: на ubuntu-latest
        # они уже есть.
        run: playwright install --with-deps chromium

      - name: Форматирование (ruff format)
        run: ruff format --check src tests tools

      - name: Линтер (ruff check)
        run: ruff check src tests tools

      - name: Проверка типов (mypy)
        # Проверяются оба пакета: v1 ещё лежит в репозитории как ориентир,
        # и его ошибки типов тоже надо видеть. Если v1 начнёт мешать —
        # его надо удалить, а не выключать проверку.
        run: mypy src

      - name: Тесты с покрытием
        env:
          # Без этого Qt пробует открыть настоящий экран: в CI его нет,
          # и тесты интерфейса падают при создании QApplication.
          QT_QPA_PLATFORM: offscreen
        # Покрытие считается по src/tvhost2 — это нынешний код. Раньше здесь
        # стоял путь v1 (src/tvhost), которого мы не касаемся: цифра была
        # всегда про старую версию, и по ней нельзя было судить о новой.
        #
        # Тесты с пометкой `browser` идут ОТДЕЛЬНЫМ шагом ниже: они
        # поднимают Chromium, и от их наличия не должен зависеть порог
        # покрытия. Раньше не было ни playwright в зависимостях, ни этого
        # разделения — pytest.importorskip() молча выбрасывал модуль,
        # покрытие падало с 79% до 69%, и CI краснел по непонятной причине.
        # Код возврата pytest — настоящий: гейт краснеет, когда упал тест,
        # не собрался модуль или покрытие ниже порога.
        #
        # Раньше здесь стоял `continue-on-error: true`, а вердикт выносил
        # следующий шаг по ЖУРНАЛУ, искав в нём `N failed`. Проверено на
        # подставных журналах — такой гейт пропускал три случая из четырёх:
        #   • «FAIL Required test coverage of 68.0% not reached» — падение
        #     порога покрытия (слова failed в строке нет);
        #   • «ERROR tests/...» при неразобранном модуле;
        #   • пустой журнал целиком.
        # Строка `1 failed` к тому же исчезает из журнала, когда любой
        # плагин печатает итог иначе. Гейт, который пропускает падение, —
        # не гейт, поэтому смотрим на код возврата, а не на текст.
        run: |
          set -o pipefail
          # Сетевые тесты исключены из БЛОКИРУЮЩЕГО прогона: они ходят на
          # живые сайты, и падение Kodik не должно валить мерж. Их гоняет
          # отдельное задание «Регресс на реальных источниках».
          pytest -m "not browser and not network" \
            --cov=src/tvhost2 --cov-report=term --cov-report=xml 2>&1 | tee pytest.log

      - name: Журнал тестов
        # Выгружается и при падении: причину видно без прав на логи Actions.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 7

      - name: Тесты воспроизведения (Chromium)
        env:
          QT_QPA_PLATFORM: offscreen
        # Живые проверки hls.js: играет ли видео и звук на самом деле.
        # Не влияют на порог покрытия — их задача поймать регресс плеера.
        run: pytest -m browser -v

      - name: Порог покрытия не снижен
        # Порог задан fail_under в pyproject.toml, и pytest его уже проверил
        # (код возврата шага «Тесты с покрытием»). Здесь проверяется ФАКТ из
        # отчёта, а не константа из конфига: раньше шаг печатал значение
        # fail_under и всегда был зелёным — то есть не проверял ничего.
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          actual = float(root.get("line-rate") or 0) * 100
          import tomllib, pathlib
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          need = float(cfg["tool"]["coverage"]["report"]["fail_under"])
          print(f"покрытие по coverage.xml: {actual:.2f} % (порог {need:.0f} %)")
          if actual < need:
              print("::error::покрытие ниже порога")
              sys.exit(1)
          PY

      - name: Сборка артефакта
        run: |
          pip install build
          python -m build

  security:
    name: Безопасность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAST — статический анализ (bandit через ruff)
        # --select на командной строке перекрывает ignore из pyproject.toml,
        # поэтому осознанные исключения (S101 — проверки в __main__, S104/S310/S603 — ADR-0002)
        # передаются здесь же, иначе шаг краснеет на них.
        run: |
          pip install ruff
          ruff check src --select S --ignore S101,S104,S310,S603

      - name: SCA — уязвимости зависимостей
        # Блокирует, а не предупреждает: `|| echo warning` превращал шаг в
        # зелёный при любом результате — проверка существовала формально.
        #
        # Сканируется ОКРУЖЕНИЕ, а не requirements.txt: в requirements.txt
        # три строки без версий (то, что ставится, определяется резолвером),
        # а dev-зависимостей там нет вовсе. `pip-audit -r` на таком файле
        # проверял не то, что установлено.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .
          pip-audit --desc

      - name: Secret scanning
        # gitleaks-action требует собственного токена с правами на PR,
        # поэтому секреты ловим встроенными правилами ruff (S105–S107).
        run: |
          python -m pip install ruff
          ruff check src --select S105,S106,S107

  regression:
    name: Регресс на реальных источниках
    runs-on: ubuntu-latest
    # Сетевой тест: падение CDN не должно блокировать мерж документации
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Запуск сервера и проверка источников
        run: |
          # v1 (`python -m tvhost.proxy`) удалён из дерева 24.11.2026 —
          # запускаем v2. `tvhost` ставится точкой входа пакета.
          tvhost --port 9000 &
          sleep 8
          # -m network выбирает тесты, помеченные как сетевые.
          # Код 5 = «ничего не выбрано»: сетевых тестов сейчас нет, это не сбой.
          # Внимание: шаги идут под `bash -e`, поэтому обычный `; code=$?`
          # не сработает — шелл выйдет раньше. Ловим через `|| code=$?`.
          code=0
          python -m pytest tests/ -q -m network || code=$?
          if [ "$code" -eq 5 ]; then
            # Код 5 = «ничего не выбрано». Раньше это молча считалось нормой,
            # и маркер мог исчезнуть вместе с тестами — регресс на живых
            # источниках просто перестал бы существовать.
            echo "::error::сетевых тестов не найдено, а они должны быть (маркер network)"
            exit 1
          fi
          exit $code
