<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видео для GTA 5 — прямые ссылки</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; }
    video { width: 100%; background: #000; border-radius: 8px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    .direct { font-size: 14px; }
  </style>
</head>
<body>
  <h1>🎬 Видео для GTA 5</h1>
  <p>Ниже — прямые ссылки на MP4. Скопируйте ссылку и вставьте её в телевизор в игре
     (мод Media Player V / WreckDTV / внутриигровой браузер).</p>

  <!-- ===== Пример карточки. Скопируйте блок и поменяйте video.mp4 на свой файл ===== -->
  <div class="card">
    <h3>video.mp4</h3>
    <video controls preload="metadata" src="video.mp4"></video>
    <p class="direct">Прямая ссылка: <code>https://USERNAME.github.io/REPO/video.mp4</code></p>
  </div>

</html>
